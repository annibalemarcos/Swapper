<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Loja - Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .register-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-card">
            <h2 class="text-center mb-4"><i class="fas fa-store"></i> Registrar Loja</h2>
            
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nome da Loja</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Chave PIX</label>
                    <input type="text" class="form-control" name="pix_key" required 
                           placeholder="CPF, email, telefone ou chave aleatória">
                    <small class="text-muted">Onde você receberá os pagamentos</small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Webhook URL (Opcional)</label>
                    <input type="url" class="form-control" name="webhook_url" 
                           placeholder="https://sua-loja.com/webhook">
                    <small class="text-muted">Receba notificações de pagamento</small>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-check"></i> Criar Conta
                </button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/merchant/login">Já tem conta? Faça login</a>
            </div>
        </div>
    </div>
</body>
</html>
