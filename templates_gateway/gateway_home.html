<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Payment Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .hero { text-align: center; color: white; }
        .feature-card { background: white; border-radius: 15px; padding: 30px; margin: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1 class="display-3 mb-4">💳 Crypto Payment Gateway</h1>
            <p class="lead mb-5">Aceite pagamentos em criptomoedas e receba em PIX automaticamente</p>
            
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="feature-card">
                        <i class="fas fa-rocket fa-3x text-primary mb-3"></i>
                        <h4>Comece Agora</h4>
                        <p>Cadastre sua loja em segundos</p>
                        <a href="/merchant/register" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-user-plus"></i> Registrar
                        </a>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="feature-card">
                        <i class="fas fa-sign-in-alt fa-3x text-success mb-3"></i>
                        <h4>Já tem conta?</h4>
                        <p>Acesse seu dashboard</p>
                        <a href="/merchant/login" class="btn btn-success btn-lg w-100">
                            <i class="fas fa-key"></i> Login
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="row mt-5">
                <div class="col-md-3">
                    <div class="feature-card text-center">
                        <i class="fas fa-coins fa-2x text-warning mb-2"></i>
                        <h6>6 Criptomoedas</h6>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="feature-card text-center">
                        <i class="fas fa-bolt fa-2x text-danger mb-2"></i>
                        <h6>Conversão Automática</h6>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="feature-card text-center">
                        <i class="fas fa-shield-alt fa-2x text-success mb-2"></i>
                        <h6>100% Seguro</h6>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="feature-card text-center">
                        <i class="fas fa-chart-line fa-2x text-info mb-2"></i>
                        <h6>Dashboard Completo</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
