<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .product-detail-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .product-image-large { font-size: 10rem; text-align: center; padding: 60px; background: #f8f9fa; border-radius: 15px; }
        .price-box { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; padding: 30px; border-radius: 15px; text-align: center; }
        .btn-add-cart { font-size: 1.2rem; padding: 15px 40px; }
        .cart-badge { position: absolute; top: -8px; right: -8px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-store"></i> <strong>TechStore</strong></a>
            <div class="d-flex align-items-center">
                <a href="/" class="btn btn-outline-light me-2">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <a href="/cart" class="btn btn-light position-relative">
                    <i class="fas fa-shopping-cart"></i> Carrinho
                    <span class="badge bg-danger cart-badge" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="product-detail-card">
            <div class="row">
                <div class="col-md-6">
                    <div class="product-image-large">{{ product.image }}</div>
                </div>

                <div class="col-md-6">
                    <div class="mb-3">
                        <span class="badge bg-primary">{{ product.category }}</span>
                    </div>
                    
                    <h1 class="mb-3">{{ product.name }}</h1>
                    <p class="lead text-muted mb-4">{{ product.description }}</p>
                    
                    <div class="price-box mb-4">
                        <h6 class="mb-2">PREÇO</h6>
                        <h2 class="mb-0">R$ {{ "%.2f"|format(product.price) }}</h2>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Quantidade:</label>
                        <div class="input-group" style="max-width: 200px;">
                            <button class="btn btn-outline-secondary" onclick="changeQty(-1)">
                                <i class="fas fa-minus"></i>
                            </button>
                            <input type="number" class="form-control text-center" id="quantity" value="1" min="1" max="99">
                            <button class="btn btn-outline-secondary" onclick="changeQty(1)">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mb-4">
                        <button class="btn btn-primary btn-add-cart" onclick="addToCart()">
                            <i class="fas fa-cart-plus"></i> Adicionar ao Carrinho
                        </button>
                        <button class="btn btn-success btn-add-cart" onclick="buyNow()">
                            <i class="fas fa-bolt"></i> Comprar Agora
                        </button>
                    </div>

                    <div class="card bg-light">
                        <div class="card-body">
                            <h6 class="card-title"><i class="fas fa-shield-alt text-success"></i> Informações</h6>
                            <ul class="mb-0">
                                <li><i class="fas fa-check text-success"></i> Frete Grátis</li>
                                <li><i class="fas fa-check text-success"></i> Pagamento com Crypto</li>
                                <li><i class="fas fa-check text-success"></i> Entrega Rápida</li>
                                <li><i class="fas fa-check text-success"></i> Garantia do Fabricante</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function changeQty(delta) {
            const input = document.getElementById('quantity');
            let value = parseInt(input.value) || 1;
            value = Math.max(1, Math.min(99, value + delta));
            input.value = value;
        }

        async function addToCart() {
            const quantity = parseInt(document.getElementById('quantity').value) || 1;
            
            try {
                const response = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        product_id: {{ product.id }},
                        quantity: quantity
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('cartCount').textContent = data.cart_count;
                    
                    const btn = event.target;
                    const originalHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check"></i> Adicionado!';
                    btn.classList.add('btn-success');
                    btn.classList.remove('btn-primary');
                    
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.classList.add('btn-primary');
                        btn.classList.remove('btn-success');
                    }, 2000);
                }
            } catch (error) {
                alert('Erro ao adicionar ao carrinho');
            }
        }

        async function buyNow() {
            const quantity = parseInt(document.getElementById('quantity').value) || 1;
            
            await fetch('/api/cart/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    product_id: {{ product.id }},
                    quantity: quantity
                })
            });
            
            window.location.href = '/checkout';
        }
    </script>
</body>
</html>
